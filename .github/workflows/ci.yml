name: IGM CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality (Biome)
        run: npx biome check src/

      - name: Type Verification (TypeScript)
        run: npx tsc --noEmit

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Tests (Vitest)
        run: npm run test

  build:
    name: Build Executables
    needs: [validate, test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Userscript & Bundles
        run: npm run build

      - name: Compile Standalone Executable
        run: npm run build:exe

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: igm-executable-${{ matrix.os }}
          path: |
            igm.exe
            igm
          retention-days: 7
